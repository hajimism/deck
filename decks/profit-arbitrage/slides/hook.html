<section class="slide" data-layout="default">
  <p class="kicker">はじめに ／ 山の水</p>
  <h2 class="slide-title">同じ水が、麓では50円、山頂では500円になる</h2>
  <figure class="stage profile">
    <svg viewBox="0 0 1152 400" preserveAspectRatio="none" aria-hidden="true">
      <defs>
        <clipPath id="hook-land"><path d="M 0 400 L 0 330 C 200 326, 330 300, 450 236 S 700 64, 860 34 S 1050 56, 1152 110 L 1152 400 Z" /></clipPath>
      </defs>
      <g clip-path="url(#hook-land)">
        <rect data-band="1" x="0" y="300" width="1152" height="100" />
        <rect data-band="2" x="0" y="220" width="1152" height="80" />
        <rect data-band="3" x="0" y="150" width="1152" height="70" />
        <rect data-band="4" x="0" y="90" width="1152" height="60" />
        <rect data-band="5" x="0" y="0" width="1152" height="90" />
      </g>
      <path data-kind="ridge" d="M 0 330 C 200 326, 330 300, 450 236 S 700 64, 860 34 S 1050 56, 1152 110" />
    </svg>
    <p class="axis"><span>高く評価される</span><span>低く評価される</span></p>
    <div class="spot" data-at="foot" data-tone="low" data-step="hook-foot">
      <span class="label">麓のスーパー</span>
      <span class="price">50<small>円</small></span>
      <span class="note">ペットボトルの水</span>
    </div>
    <div class="spot" data-at="peak" data-tone="peak" data-step="hook-peak">
      <span class="label">山頂の山小屋</span>
      <span class="price">500<small>円</small></span>
      <span class="note">同じペットボトルの水</span>
    </div>
    <p class="punch" data-step="hook-same">中身は同じ。それでも登山者は、<span class="mark">ためらわずに500円を払う。</span></p>
  </figure>
</section>
