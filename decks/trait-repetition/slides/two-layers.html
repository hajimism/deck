<section class="slide" data-layout="split">
  <div class="col">
    <p class="kicker">はじめに ／ 支払いの中身</p>
    <h2 class="slide-title">支払いには「手間」と「負担感」の2層がある</h2>
    <div class="layer" data-tone="pale">
      <p class="label">1層目　手間</p>
      <p><b>実際にかかる時間や労力</b></p>
      <p class="note">例：週次報告に3時間かかる</p>
    </div>
    <div class="layer" data-tone="deep">
      <p class="label">2層目　負担感</p>
      <p><b>その手間を、本人がどれだけ重く感じるか</b></p>
      <p class="note">例：その3時間が「あっという間」か「苦行」か</p>
    </div>
  </div>
  <div class="stage">
    <div class="matrix">
      <p data-axis="y">負担感　大 ← → 小</p>
      <div data-cell><b>手間は小さいが、苦痛</b>短い作業でも、毎回気が重い</div>
      <div data-cell><b>手間も負担感も大きい</b>根性で払っている状態。長く続かない</div>
      <div data-cell data-goal><span class="tag" data-fill data-tone="kari">本当に楽</span><b>手間が小さく、苦にもならない</b>今日はこの状態が生まれる仕組みを追う</div>
      <div data-cell><b>手間は大きいが、苦にならない</b>時間はかかるが、あっという間</div>
      <p data-axis="x">手間　小 ← → 大</p>
    </div>
  </div>
</section>
