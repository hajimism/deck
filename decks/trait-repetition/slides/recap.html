<section class="slide" data-layout="center">
  <p class="kicker">まとめ</p>
  <h2 class="slide-title">個性の本質は、<span class="mark">反復</span>である</h2>
  <ol class="summary">
    <li class="rise"><span class="step-no">1</span><p><b>個性とは、反復が作った偏り</b><span class="note">強みに見えるかは、隣にいる人との差で決まる</span></p></li>
    <li class="rise"><span class="step-no">2</span><p><b>反復の多くは、自分の中の黒字から起きる</b><span class="note">得るもの ＞ 手間 のとき「ついつい」繰り返す</span></p></li>
    <li class="rise"><span class="step-no">3</span><p><b>黒字の反復は循環に乗り、手間と負担感を同時に小さくする</b><span class="note">これが「楽に」の自分側の正体</span></p></li>
    <li class="rise"><span class="step-no">4</span><p><b>偏りは凸凹になる。凹は覆い、凸に投資する</b><span class="note">凹は循環に乗りにくい</span></p></li>
    <li class="rise"><span class="step-no">5</span><p><b>凸凹は自分には見えにくいので、反響から形をつかむ</b><span class="note">驚かれる、頼まれる、もどかしい、時間を忘れる</span></p></li>
  </ol>
</section>
