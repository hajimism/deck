<section class="slide" data-layout="split">
  <div class="col">
    <p class="kicker">価値を構想する ／ 型</p>
    <h2 class="slide-title">劇的 Before / After で考える</h2>
    <p class="lede">住みにくい家を「匠」がリフォームするテレビ番組がある。冒頭で家族の困りごとを丁寧に見せ、改修後に家族が驚く場面で「なんということでしょう」とナレーションが入る。</p>
    <p class="card rule" data-tone="after"><span class="label">要点</span><b>手段から考えない。Before と After から考える。</b></p>
  </div>
  <div class="stage frame" data-step="before-after-steps">
    <div class="card step" data-tone="before">
      <p class="step-head"><span class="num" data-tone="before">1</span><b>Before</b></p>
      <p>評価者は今、どう困っているか。どんな物差しを持っているか。<b>具体的に描く</b>。</p>
    </div>
    <div class="card step" data-tone="after">
      <p class="step-head"><span class="num" data-tone="after">2</span><b>After</b></p>
      <p>評価者がどうなっていれば<b>「なんということでしょう」</b>と言うか。</p>
    </div>
    <div class="card step">
      <p class="step-head"><span class="num">3</span><b>手段</b></p>
      <p>その差を埋める方法を考える。<b>最後に</b>。</p>
    </div>
    <p class="trap"><span class="tag" data-fill data-tone="before">よくある順番</span>手段 → 作業 → 「で、誰が喜ぶんだっけ？」</p>
  </div>
</section>
