<section class="slide" data-layout="default">
  <p class="kicker">儲かる状態とは ／ 取引の成立条件</p>
  <h2 class="slide-title">取引は、両側にすきまがあるときに成立する</h2>
  <p class="order"><span class="term">売り手の支払い</span><span class="lt">＜</span><span class="term" data-kind="price">価格<small>＝ 買い手の支払い</small></span><span class="lt">＜</span><span class="term" data-tone="after">買い手の評価</span></p>
  <div class="stage lines">
    <div class="line" data-step="deal-bakery">
      <p class="label">パン屋の場合 ― 成立</p>
      <div class="scale">
        <span class="band" data-side="seller"><span>店の得 150円</span></span>
        <span class="band" data-side="buyer"><span>客の得 50円</span></span>
        <span class="pin" data-at="150"><b>150円</b><small>原価＋手間</small></span>
        <span class="pin" data-at="300"><b>300円</b><small>価格</small></span>
        <span class="pin" data-at="350" data-tone="after"><b>350円</b><small>「これなら買う」</small></span>
      </div>
    </div>
    <div class="line" data-step="deal-broken">
      <p class="label">順番が崩れた場合 ― 不成立</p>
      <div class="scale">
        <span class="band" data-side="broken"><span>支払い ＞ 評価。作る前に「やらない」と決める</span></span>
        <span class="pin" data-at="300" data-tone="after"><b>300円</b><small>客の評価はここまで</small></span>
        <span class="pin" data-at="350"><b>350円</b><small>どうしてもかかる</small></span>
      </div>
    </div>
  </div>
</section>
