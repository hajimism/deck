<section class="slide" data-layout="default">
  <p class="kicker">物差しは動かせる ／ 従う と 動かす</p>
  <h2 class="slide-title">物差しに目盛りを足すと、価値の上限が上がる</h2>
  <p class="lede">上司から「A案とB案、どちらがいい？」と聞かれた。</p>
  <div class="stage ticks">
    <div class="meter">
      <p class="label">上司の物差し</p>
      <div class="bar">
        <div class="scale">
          <span class="pin" data-at="b"><b>B案</b></span>
          <span class="pin" data-at="a"><b>A案</b></span>
        </div>
        <div class="extend" data-step="new-tick-move">
          <span class="pin" data-at="c" data-tone="after"><b>C案</b><small>新しい目盛り：顧客の問い合わせ傾向</small></span>
        </div>
      </div>
      <p class="limits"><span>期待の範囲</span><span data-step="new-tick-move">更新された上限 →</span></p>
    </div>
    <div class="moves">
      <div class="card move" data-step="new-tick-follow">
        <p class="label">従う</p>
        <p>上司の好みを読んで、<b>A案を推す</b>。</p>
        <p class="voice">「ありがとう」</p>
        <p class="note">相手の期待の範囲内で、価値を出す。</p>
      </div>
      <div class="card move" data-tone="after" data-step="new-tick-move">
        <p class="label">動かす</p>
        <p>「A案もB案も、前提の顧客課題が最近の問い合わせ傾向とずれています。<b>C案のほうが問題を解けます</b>」</p>
        <p class="voice" data-tone="after">「そうか、気づかなかった」</p>
        <p class="note">相手の期待そのものを更新する。</p>
      </div>
    </div>
  </div>
</section>
