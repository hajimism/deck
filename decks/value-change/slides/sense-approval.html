<section class="slide" data-layout="default">
  <p class="kicker">仕事のセンス ／ 例1 企画の承認</p>
  <h2 class="slide-title">同じ成果でも、たどり着くまでの楽さが違う</h2>
  <p class="lede">AさんもBさんも、<b>同じ企画</b>を通した。違うのは、そこまでに払ったものだ。</p>
  <div class="stage lanes">
    <div class="axis"><span>前日</span><span>会議 1回目</span><span>2回目</span><span>3回目</span></div>
    <div class="lane" data-step="sense-approval-a">
      <span class="who" data-tone="before">A</span>
      <ol class="track">
        <li class="seg" data-at="1"><b>20分プレゼン</b><span>反論が出て持ち帰り</span></li>
        <li class="seg" data-at="2"><b>資料を直して再提案</b><span>まだ決まらない</span></li>
        <li class="seg" data-at="3" data-done><b>やっと承認</b><span>3回の会議を使った</span></li>
      </ol>
      <p class="cost"><span class="label">払ったもの</span><b class="stat" data-tone="before">3回</b></p>
    </div>
    <div class="lane" data-step="sense-approval-b">
      <span class="who" data-tone="after">B</span>
      <ol class="track">
        <li class="seg" data-at="0"><b>決裁者と5分立ち話</b><span>懸念を先に聞いておく</span></li>
        <li class="seg" data-at="1" data-done><b>確認だけで承認</b><span>会議は1回で済んだ</span></li>
      </ol>
      <p class="cost"><span class="label">払ったもの</span><b class="stat" data-tone="after">5分</b></p>
    </div>
  </div>
</section>
