<section class="slide" data-layout="default">
  <p class="kicker">価値とは何か ／ 定義</p>
  <h2 class="slide-title">価値とは、まず「変化」である</h2>
  <p class="lede">価値とは、何かが変わること。変わるものは、少なくとも4種類ある。</p>
  <div class="stage kinds">
    <div class="kind rise">
      <p class="label">状態の変化</p>
      <div class="shift"><p class="card" data-tone="before">散らかった机</p><span class="delta">Δ</span><p class="card" data-tone="after">片づいた机</p></div>
    </div>
    <div class="kind rise">
      <p class="label">理解の変化</p>
      <div class="shift"><p class="card" data-tone="before">分からなかった</p><span class="delta">Δ</span><p class="card" data-tone="after">分かった</p></div>
    </div>
    <div class="kind rise">
      <p class="label">感情の変化</p>
      <div class="shift"><p class="card" data-tone="before">不安だった</p><span class="delta">Δ</span><p class="card" data-tone="after">安心した</p></div>
    </div>
    <div class="kind rise">
      <p class="label">コストの変化</p>
      <div class="shift"><p class="card" data-tone="before">作業に3時間</p><span class="delta">Δ</span><p class="card" data-tone="after">作業が10分</p></div>
    </div>
  </div>
  <p class="punch" data-step="change-zero">何も変わらなければ、どれだけ手を動かしても価値はゼロ。作業の量ではなく、変化の量で測る。</p>
</section>
