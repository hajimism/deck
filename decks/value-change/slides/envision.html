  <h2 class="slide-title">作業ではなく、変化を構想する</h2>
  <p class="lede">同じ仕事でも、「何をするか」で書くと作業になり、「誰がどうなるか」で書くと構想になる。</p>
  <div class="stage rewrites">
    <div class="rewrite rise">
      <div class="card" data-tone="before"><p class="label">作業</p><h3>マニュアルを作る</h3></div>

      <div class="card" data-tone="after"><p class="label">変化の構想</p><h3>新しく配属された人が、先輩に質問せずに初日の作業を終えられる状態にする</h3></div>
    </div>
    <div class="rewrite rise">
      <div class="card" data-tone="before"><p class="label">作業</p><h3>顧客に電話する</h3></div>

      <div class="card" data-tone="after"><p class="label">変化の構想</p><h3>先週のトラブルで不安になっている担当者が、電話を切るとき「任せておけば大丈夫」と思っている状態にする</h3></div>
    </div>
    <p class="hint rise"><span class="tag">書き方</span><b>「＿＿さんが、＿＿な状態になっている」</b>の形で書くと、作業が変化に変わる。</p>
