<section class="slide" data-layout="stack">
  <p class="kicker">VISION ／ 仮想敵</p>
  <h2 class="slide-title">敵は人ではなく、状態に置く</h2>
  <p class="lede">敵を人に置くと、周りの人たちが抵抗勢力になる。チームは核で価値を出す前に、周りとの戦いで消耗する。</p>
  <div class="stage cols">
    <div class="card" data-tone="rust" data-top data-step="enemy-person">
      <span class="chip">✕ 敵を、人に置く</span>
      <p class="say">「営業部の作り方が、雑だ」</p>
      <div class="sides">
        <span class="party">わたしたち</span>
        <span class="vs">VS</span>
        <span class="party" data-foe>営業部</span>
      </div>
      <p class="note">営業部は、抵抗勢力になる。</p>
    </div>
    <div class="card" data-tone="jade" data-top data-step="enemy-state">
      <span class="chip">○ 敵を、状態に置く</span>
      <p class="say">「見積もりの差し戻しが、月に<b>20件</b>ある」</p>
      <div class="sides">
        <span class="party">わたしたち ＋ 営業部</span>
        <span class="vs">VS</span>
        <span class="party" data-foe>差し戻し 20件／月</span>
      </div>
      <p class="note">営業部にとっても、差し戻しは減ってほしい。同じ敵を前にすれば、友になれる。</p>
    </div>
  </div>
  <p class="note" data-step="enemy-state">敵は、手戻り、顧客の待ち時間、月末の残業のような「状態」に置く。</p>
</section>
