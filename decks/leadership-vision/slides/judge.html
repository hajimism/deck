<section class="slide" data-layout="split">
  <div class="col">
    <p class="kicker">VISION ／ 評価者</p>
    <h2 class="slide-title">リーダー自身が、最初の評価者である</h2>
    <p class="lede">仕事の最初の一手は、評価者の物差しを知ること。リーダーには、もう一人評価者がいる。リーダー自身だ。</p>
    <p class="punch" data-step="judge-range">自分の物差しにない変化は、<br>思いつきもしない</p>
    <p class="note" data-step="judge-range">チームが目指す After は、リーダーが「これは良い」と思えるものの範囲でしか描けない。</p>
  </div>
  <figure class="stage range">
    <p class="label">例：営業資料の刷新 ／ 描ける After の範囲</p>
    <div class="body">
      <div class="rings" aria-hidden="true">
        <div class="ring" data-tone="sun"></div>
        <div class="ring" data-tone="slate"></div>
      </div>
      <ol class="legend" data-step="judge-example">
        <li data-tone="sun">
          <span class="label">リーダーB の物差し</span>
          <p>「顧客が<b>どこで飽きるか</b>」まで見る</p>
          <p class="after"><span class="chip">AFTER</span>商談が回る資料</p>
        </li>
        <li data-tone="slate">
          <span class="label">リーダーA の物差し</span>
          <p>「資料は、<b>きれいなら十分</b>」</p>
          <p class="after"><span class="chip">AFTER</span>きれいな資料</p>
        </li>
      </ol>
    </div>
    <figcaption class="note" data-step="judge-example">チームの腕が同じでも、目指す変化の大きさが変わる。</figcaption>
  </figure>
</section>
