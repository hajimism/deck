<section class="slide" data-layout="stack">
  <p class="kicker">THESIS ／ 今日の定義</p>
  <h2 class="slide-title">リーダーの仕事＝あるべき変化を構想し、その実現のために手を尽くすこと</h2>
  <div class="stage cols">
    <div class="card" data-tone="sun" data-top>
      <span class="chip">01 ／ 構想する</span>
      <h3>作業ではなく、変化を描く</h3>
      <ol class="shift" data-step="definition-vision">
        <li data-tone="slate"><span class="label">作業</span><s>研修資料を整える</s></li>
        <li data-tone="sun"><span class="label">変化</span><b>新しく来た人が誰でも、3か月で一人立ちできるチームにする</b></li>
      </ol>
      <p class="note" data-step="definition-vision">一人では起こせない大きさの変化を、チームの単位で描く。</p>
    </div>
    <div class="card" data-tone="jade" data-top>
      <span class="chip">02 ／ 手を尽くす</span>
      <h3>自分の手だけでは、実現できない</h3>
      <ol class="flows" data-step="definition-effort">
        <li>
          <span class="label">一人の仕事</span>
          <span class="node">構想</span><i>→</i><span class="node">自分の手</span><i>→</i><span class="node" data-end>変化</span>
        </li>
        <li>
          <span class="label">リーダーの仕事</span>
          <span class="node">構想</span><i>→</i><span class="node" data-many>人の手 × 人の手 × 人の手</span><i>→</i><span class="node" data-end>変化</span>
        </li>
      </ol>
      <p class="note" data-step="definition-effort">リーダーが描く変化は、チームの大きさで描かれる。だから、人の手を通じてしか実現しない。</p>
    </div>
  </div>
</section>
