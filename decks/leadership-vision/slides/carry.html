<section class="slide" data-layout="split">
  <div class="col">
    <p class="kicker">VISION ／ 裁定</p>
    <h2 class="slide-title">チームの凸を、高く評価される場所へ運ぶ</h2>
    <p class="lede">自分の凸を、高く評価される場所へ運ぶ。第3回で見た裁定は、チームにも使える。</p>
    <p class="note">だから構想とは、チームとして、<b>どの評価者の、どんな変化</b>を目指すかを決めることでもある。</p>
  </div>
  <figure class="stage route">
    <p class="label">例：顧客の声を、開発部へ運ぶサポートチーム</p>
    <div class="node" data-tone="slate">
      <span class="label">FROM ／ サポートチーム</span>
      <b>毎日、顧客の不満を聞いている</b>
      <span class="chip" data-ghost>チームの中では、当たり前の情報</span>
    </div>
    <div class="leg" data-step="carry-support">
      <span class="arrow" aria-hidden="true"></span>
      <p><span class="label">構想</span><b>毎月、問い合わせの上位5件を開発部に届け、次の改修に一つは入っている状態にする</b></p>
    </div>
    <div class="node" data-tone="sun" data-to data-step="carry-support">
      <span class="label">TO ／ 開発部</span>
      <b>次に何を作るかを決める材料になる</b>
      <span class="chip">新しい評価者がつく</span>
    </div>
    <p class="echo note" data-step="carry-support"><span class="chip" data-tone="jade">反響</span> メンバーの毎日の仕事に、開発部から反響が返ってくる。</p>
  </figure>
</section>
