    <h2 class="slide-title">リーダーがイケてるなら、物差しは感染する</h2>
    <p class="lede">内側からの経路は、ミメーシス（模倣）。人は、憧れる人の振る舞いを、意識しないうちに真似る。言葉の選び方、資料の作り方、困ったときの判断の仕方が、少しずつ似てくる。</p>
    <p class="note">リーダーが数字の食い違いを気にする人なら、メンバーも気になりはじめる。顧客の困りごとを面白がる人なら、メンバーも面白がりはじめる。やること自体から得るものが増え、強制しなくても反復が続く。</p>
