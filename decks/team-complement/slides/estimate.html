<section class="slide" data-layout="default">
  <p class="kicker">PROBLEM ／ 赤字の作業</p>
  <h2 class="slide-title">苦手な作業は、得意なことの時間まで削っていく</h2>
  <p class="lede">例：企画を考えるのは得意だが、細かい計算は苦手な人が、見積書まで一人で作る。</p>
  <ol class="stage flow">
    <li class="card"><span class="num">1</span><b>見積書を一人で作る</b><span class="note">苦手な計算を、自分で抱える</span></li>
    <li class="card" data-tone="b" data-fill data-step="estimate-loop"><span class="num">2</span><b>計算ミスで差し戻される</b><span class="note">直すうちに、別のミスも見つかる</span></li>
    <li class="card" data-tone="b" data-fill data-step="estimate-cost"><span class="num">3</span><b>企画の時間が削られる</b><span class="note">いちばん得意なことに使えない</span></li>
  </ol>
  <div class="days" data-step="estimate-cost">
    <p class="label">1週間の使い方</p>
    <div class="day">
      <span class="note">本来</span>
      <p class="bar"><span data-tone="a" data-w="70">企画を考える</span><span data-tone="cost" data-w="30">見積書</span></p>
    </div>
    <div class="day">
      <span class="note">実際</span>
      <p class="bar"><span data-tone="a" data-w="30">企画</span><span data-tone="b" data-w="70">見積書と、その直し</span></p>
    </div>
  </div>
  <p class="punch" data-step="estimate-cost">苦手な作業の損は、<span class="mark">その作業の中だけでは終わらない。</span></p>
</section>
