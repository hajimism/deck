  <h2 class="slide-title">お膳立ては往復する</h2>
  <p class="lede">第1回の、先輩と後輩の例。二人はたがいに、別の方向のお膳立てをしている。</p>
  <div class="stage loop">
    <div class="end" data-tone="b"><span class="who">後</span><b>後輩</b></div>
    <ol class="lanes">
      <li class="card" data-tone="b" data-fill>
