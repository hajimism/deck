<section class="slide" data-layout="default">
  <p class="kicker">SOLUTION 02 ／ 伝え方の型</p>
  <h2 class="slide-title">自分の凸凹は、覆い方まで添えて伝える</h2>
  <p class="lede">凸と凹は、両方とも周りに伝える。凹が分からなければ、周りの人は覆いようがない。</p>
  <div class="stage composer">
    <p class="label">型</p>
    <p class="line">
      「<span class="slot" data-tone="a">〇〇</span>は得意なので<span class="say" data-tone="a">任せてください</span>。
      <span class="slot" data-tone="b">△△</span>は時間がかかるので、<span class="slot" data-tone="c">□□</span>して<span class="say" data-tone="c">もらえると助かります</span>。」
    </p>
  </div>
  <div class="cols">
    <div class="card" data-tone="a" data-fill data-step="tell-up">
      <span class="label">凸を伝えるとき</span>
      <h3>「任せてください」と、引き受け手として名乗り出る</h3>
    </div>
    <div class="card" data-tone="c" data-fill data-step="tell-down">
      <span class="label">凹を伝えるとき</span>
      <h3>「こうしてもらえると助かる」まで添える</h3>
      <p class="note">覆い方まで分かれば、相手はすぐに手を貸せる。</p>
    </div>
  </div>
</section>
