<section class="slide" data-layout="default">
  <p class="kicker">SOLUTION 02 ／ 読める凸凹</p>
  <h2 class="slide-title">凸凹が読めると、探らずに頼める</h2>
  <p class="lede">お膳立てするには、相手のどこを引き受け、どこを手伝えばいいかが分かっている必要がある。</p>
  <div class="stage cols">
    <div class="card side" data-tone="cost" data-step="readable-probe">
      <span class="chip" data-fill>読めないチーム</span>
      <ol class="steps">
        <li><span class="num">1</span>頼みたい</li>
        <li><span class="num">2</span>「この人は何が得意か」を探る</li>
        <li><span class="num">3</span>「どこが不安か」を探る</li>
        <li><span class="num">4</span>探りきれずに、頼み方を外す</li>
      </ol>
      <p class="note"><b>探り合いが、そのまま調整コストになる。</b>お膳立ては偶然にしか起きない。</p>
    </div>
    <div class="card side" data-tone="a" data-line>
      <span class="chip" data-fill>読めるチーム</span>
      <ol class="steps">
        <li><span class="num">1</span>頼みたい</li>
        <li><span class="num">2</span>得意なところを任せ、不安なところを手伝う</li>
      </ol>
      <p class="note"><b>探る時間がいらない。</b>お膳立てが、狙って起きる。</p>
    </div>
  </div>
</section>
