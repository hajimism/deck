<section class="slide" data-layout="default">
  <p class="kicker">OUTCOME ／ 天井を上げる</p>
  <h2 class="slide-title">天井を上げるのは凸。だから、凸は削らずに残す</h2>
  <p class="lede">床をどれだけ上げても、天井は、誰かの凸の高さでしか決まらない。例：資料の作り方を、型で統一する。</p>
  <div class="stage cols">
    <figure class="card team" data-tone="a">
      <span class="label">型が床を支え、凸の工夫も許す</span>
      <div class="chart">
        <ol class="ticks"><li>5</li><li>4</li><li>3</li><li>2</li><li>1</li><li>0</li></ol>
        <div class="plot">
          <ol class="bars">
            <li data-v="3"></li>
            <li data-v="3"></li>
            <li data-v="5" data-tone="c"></li>
            <li data-v="3"></li>
          </ol>
          <p class="level" data-at="5" data-tone="c"></p>
          <p class="level" data-at="3"></p>
        </div>
        <ol class="names"><li>Aさん</li><li>Bさん</li><li>図解が上手い人</li><li>Dさん</li></ol>
      </div>
      <figcaption><b>床は 3、天井は 5。</b></figcaption>
    </figure>
    <figure class="card team" data-tone="cost" data-step="ceiling-cut">
      <span class="label">「全員この型で」と、工夫まで禁止する</span>
      <div class="chart">
        <ol class="ticks"><li>5</li><li>4</li><li>3</li><li>2</li><li>1</li><li>0</li></ol>
        <div class="plot">
          <ol class="bars">
            <li data-v="3"></li>
            <li data-v="3"></li>
            <li data-v="3" data-cut></li>
            <li data-v="3"></li>
          </ol>
          <p class="level" data-at="5" data-ghost></p>
          <p class="level" data-at="3" data-tone="b"></p>
        </div>
        <ol class="names"><li>Aさん</li><li>Bさん</li><li>図解が上手い人</li><li>Dさん</li></ol>
      </div>
      <figcaption><b>床は 3 のまま、天井が 5 から 3 に下がる。</b></figcaption>
    </figure>
  </div>
  <p class="punch" data-step="ceiling-cut">型は床のために使い、<span class="mark">凸の出番は残しておく。</span></p>
</section>
