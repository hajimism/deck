<section class="slide" data-layout="split">
  <div class="col">
    <p class="kicker">OUTCOME ／ 品質</p>
    <h2 class="slide-title">品質には、床と天井がある</h2>
    <dl class="defs">
      <div><dt class="chip" data-tone="a" data-fill>天井</dt><dd>チームで出せる、最高のもの</dd></div>
      <div><dt class="chip" data-tone="c" data-fill>床</dt><dd>チームの誰がやっても出せる、最低ライン</dd></div>
    </dl>
    <p class="card chef" data-step="floor-ceiling-chef"><b>レストランで言えば</b>レシピと手順書が床を作り、シェフの腕が天井を作る。レシピがなければ日によって味が変わり、シェフがいなければどの店でも出せる味にしかならない。</p>
  </div>
  <figure class="stage room">
    <div class="ceil" data-tone="a"><span class="label">天井 ↑</span><b>凸で上げる</b><span class="note">シェフの腕</span></div>
    <div class="space">
      <p class="label">チームの品質が出る範囲</p>
    </div>
    <div class="floor" data-tone="c"><span class="label">床 ↑</span><b>仕組みで上げる</b><span class="note">レシピと手順書</span></div>
    <figcaption class="punch" data-step="floor-ceiling-rule">床は仕組みで上げ、<span class="mark">天井は凸で上げる。</span></figcaption>
  </figure>
</section>
