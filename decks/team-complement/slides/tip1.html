<section class="slide" data-layout="default">
  <p class="kicker">SOLUTION 03 ／ コツ1　衝突が起きる前に</p>
  <h2 class="slide-title">衝突が起きる前に、チームの物差しを「AよりB」で決めておく</h2>
  <div class="stage cols">
    <div class="card" data-tone="cost">
      <span class="label">毎回、個人どうしで話し合う</span>
      <p class="big">速さと正確さ、今回はどっち？</p>
      <p class="note">ぶつかるたびに、話し合いの時間がかかる。高くつく。</p>
    </div>
    <div class="card" data-tone="a" data-fill>
      <span class="label">チームとして、先に決めておく</span>
      <p class="big">迷ったら、こっちを選ぶ</p>
      <p class="note">そもそも、ぶつからずに済む。</p>
    </div>
  </div>
  <div class="motto" data-step="tip1-agile">
    <p class="label">代表例：アジャイルソフトウェア開発宣言</p>
    <p class="formula"><span data-tone="cost">包括的なドキュメント</span><i>より</i><span data-tone="a">動くソフトウェア</span><i>を</i></p>
    <p class="note">Aの価値も認めたうえで、迷ったらBを優先する、という約束。物差しは「AよりB」の形で書く。</p>
  </div>
</section>
