<section class="slide" data-bg="paper" data-layout="default" data-folio="12">
  <p class="kicker">02 — Rewrite</p>
  <h2 class="slide-title">手段の独占は、欲求そのものを作り変える</h2>
  <p class="lede">ある手段がほぼ唯一の経路になると、欲求の中身が<b>手段の形に上書き</b>される。</p>

  <div class="stage table">
    <div class="head">
      <span class="label">もとの欲求</span>
      <span></span>
      <span class="label">独占した手段</span>
      <span></span>
      <span class="label">上書きされた後の「欲求」</span>
    </div>
    <div class="row">
      <p class="need">移動したい</p>
      <span class="arrow" aria-hidden="true"></span>
      <p class="means">車</p>
      <span class="arrow" aria-hidden="true"></span>
      <div class="after">
        <p class="said">車に乗れること</p>
        <p class="note">歩いて暮らすことは、もう想定されない</p>
      </div>
    </div>
    <div class="row" data-step="rewrite-rows">
      <p class="need">学びたい</p>
      <span class="arrow" aria-hidden="true"></span>
      <p class="means">学校</p>
      <span class="arrow" aria-hidden="true"></span>
      <div class="after">
        <p class="said">就学し、卒業証書を持つこと</p>
        <p class="note">深く習得していても、学校に行っていなければ「学んでいない人」</p>
      </div>
    </div>
    <div class="row" data-step="rewrite-rows">
      <p class="need">健康でいたい</p>
      <span class="arrow" aria-hidden="true"></span>
      <p class="means">医療</p>
      <span class="arrow" aria-hidden="true"></span>
      <div class="after">
        <p class="said">検査値が正常で、定期的に受診していること</p>
        <p class="note">自分の感覚で判断することは「素人判断」に格下げ</p>
      </div>
    </div>
  </div>

  <p class="punch" data-step="rewrite-rows">人は、自分が何を求めていたのかを、制度の語彙でしか語れなくなる。</p>
