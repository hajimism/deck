  <div class="col lead">
    <p class="kicker">07 — Participation</p>
    <h2 class="slide-title">成熟は、<br>ひとりでは起きない</h2>
    <blockquote class="quote big">「一人の赤ん坊というものは、<br>存在しない」</blockquote>
    <p class="note who">— D. W. ウィニコット</p>
    <p class="lede">赤ん坊は常に「世話する誰かと共にいる赤ん坊」。<br>観察の単位は、個体ではなく<b>関係</b>。</p>
  </div>
  <div class="stage">
    <div class="card band">
      <p class="label">グルーヴは、奏者たちの「間」に生まれる</p>
      <div class="ring-area">
        <svg class="wires" viewBox="0 0 100 80" preserveAspectRatio="none" aria-hidden="true">
          <line x1="50" y1="12" x2="16" y2="68"></line>
          <line x1="50" y1="12" x2="84" y2="68"></line>
          <line x1="16" y1="68" x2="84" y2="68"></line>
        </svg>
        <span class="player p-a" data-tone="score">ベース</span>
        <span class="player p-b" data-tone="live">ピアノ</span>
        <span class="player p-c" data-tone="ink">ドラム</span>
        <span class="groove">GROOVE</span>
      </div>
      <p class="note">自分の部屋で完璧に練習したフレーズも、<br>バンドの中で互いに聴き合いながら鳴らされて、初めてスウィングする。</p>
    </div>
    <p class="punch"><span>成熟は、関係の中でだけ育つ<span class="grad-on-ink">参加的な現象</span>である。</span></p>
