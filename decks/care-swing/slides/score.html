<section class="slide" data-bg="paper" data-layout="default" data-folio="21">
  <p class="kicker">04 — Score</p>
  <h2 class="slide-title">楽譜は鳴らない。<br>でも300年後の私たちに、音楽を手渡す</h2>
  <div class="stage">
    <div class="card sheet" data-tone="ink">
      <div class="sheet-head">
        <span class="tag">楽譜 = 保存形式</span>
        <span class="label">J. S. Bach</span>
      </div>
      <div class="staff" aria-hidden="true">
        <span class="clef">𝄞</span>
        <i class="line"></i><i class="line"></i><i class="line"></i><i class="line"></i><i class="line"></i>
        <b class="head"></b><b class="head"></b><b class="head"></b><b class="head"></b><b class="head"></b><b class="head"></b><b class="head"></b><b class="head"></b>
      </div>
      <div class="span">
        <div class="end"><b class="year">1723</b><span class="note">書かれた。紙は鳴らない</span></div>
        <div class="arrow"><span class="pill" data-tone="white">300年</span></div>
        <div class="end end-right"><b class="year">2026</b><span class="note">それでも、いま鳴らせる</span></div>
      </div>
      <p class="keep">形式とは、本質を<b>いま生きていない者</b>へ手渡すための保存形式。</p>
    </div>

    <div class="col turn" data-step="score-question">
      <div class="shift">
        <p class="ask ask-old"><span class="label">これまでの問い</span><s>形式から本質へ帰るには？</s></p>

      <table class="matrix pair">
        <thead>
          <tr><th class="h-score">楽譜</th><th class="h-live">即興</th></tr>
        </thead>
        <tbody>
          <tr><td class="c-score">固定された形式</td><td class="c-live">その場での生成</td></tr>
          <tr><td class="c-score">繰り返せる</td><td class="c-live">一回きり</td></tr>
          <tr><td class="c-score">書かれたもの</td><td class="c-live">生きた声</td></tr>
          <tr><td class="c-score">誰が読んでも同じ</td><td class="c-live">この私がいま鳴らす</td></tr>
        </tbody>
      </table>
      <p class="note">どちらかを上に置きたがる構図は、制度とケアの対立とそっくり。</p>
    </div>
  </div>
