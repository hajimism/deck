<section class="slide" data-bg="paper" data-layout="default" data-folio="18">
  <p class="kicker">03 — Regrowth</p>
  <h2 class="slide-title">装置を撤去しても、跡地にはすぐ次の型が生える</h2>
  <p class="lede">第1章の2つの事例は、どちらも「測定装置を取り除く」という、イリイチ好みの操作だった。</p>

  <div class="stage site">
    <span class="label h-case">事例</span>
    <span class="label h-gone">撤去した装置</span>
    <span class="label h-hope">イリイチが期待した跡地</span>
    <span class="label h-grew">実際に生えたもの</span>

    <p class="case c-a">有給<br>取り放題</p>
    <p class="gone g-a"><span>日数管理</span></p>
    <p class="case c-b">給与<br>自己決定</p>
    <p class="gone g-b"><span>査定</span></p>

    <div class="hope">
      <p class="hope-what">制度の外の、<br>生身の応答</p>
      <span class="stamp">現れなかった</span>
    </div>

    <div class="grew w-a">
      <span class="tag">新しい型</span>
      <p class="said">「休んでね」</p>
      <p class="note">相手を読まずに出せる、みんなの習慣</p>
    </div>
    <div class="grew w-b">
      <span class="tag">新しい型</span>
      <p class="said">優しいレビュー</p>
      <p class="note">レビューは増え、耳の痛いことは消えた</p>
    </div>
  </div>

  <p class="punch">人は、型なしでは動けない。撤去の跡地には、すぐ次の型が生える。</p>
</section>
