    <p class="kicker">複利の定義</p>
    <h2 class="slide-title">複利とは、残ったものを<br>次に使うこと</h2>

      <li data-step="define-work"><span class="num">1</span><div><b>しごとをする</b><p class="note">いつもの業務、プロジェクト、打ち合わせ。</p></div></li>
      <li data-step="define-left"><span class="num">2</span><div><b>何かが残る</b><p class="note">技量、コード、信頼、空いた時間、評判。</p></div></li>
      <li data-step="define-reuse"><span class="num">3</span><div><b>残ったものを使って、次のしごとをする</b><p class="note">次はもっと多くのものが残る。</p></div></li>
    </ol>
