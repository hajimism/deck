<section class="slide" data-layout="default">
  <p class="kicker">3 ／ 実践 ― 掟</p>
  <h2 class="slide-title">寄り道の掟：4か条</h2>
  <div class="stage laws">
    <div class="card law" data-tone="tool" data-step="rules-1">
      <p class="law-head"><span class="sticker" data-tone="tool">第1条</span><b>締切と品質を人質にしない</b></p>
      <p>重力があるから寄り道は輝く。重力が死ぬと、寄り道はただのサボりに転落する。</p>
      <p class="broken"><span class="chip">破ると</span>ただのサボり</p>
    </div>
    <div class="card law" data-tone="toy" data-step="rules-2">
      <p class="law-head"><span class="sticker" data-tone="toy" data-tilt="r">第2条</span><b>隠さない</b></p>
      <p>こっそりやる遊びは孤立していく。見せ合える形にして、仲間を巻き込む。</p>
      <p class="broken"><span class="chip">破ると</span>孤立感に落ちる</p>
    </div>
    <div class="card law" data-tone="both" data-step="rules-3">
      <p class="law-head"><span class="sticker" data-tone="both">第3条</span><b>ときどき本線に還す</b></p>
      <p>寄り道で得た技術や改善を、本業の品質に還す。道具と玩具の両輪が噛み合う。</p>
      <p class="broken"><span class="chip">破ると</span>本業と切れた趣味になる</p>
    </div>
    <div class="card law" data-tone="sun" data-step="rules-4">
      <p class="law-head"><span class="sticker" data-tone="sun" data-tilt="r">第4条</span><b>競争にしない</b></p>
      <p>ランキングやスコアで競わせると、熱意ではなく働きすぎを育てる。共犯感は勝ち負けではなく、たくらみの共有から生まれる。</p>
      <p class="broken"><span class="chip">破ると</span>働きすぎを育てる</p>
    </div>
  </div>
</section>
