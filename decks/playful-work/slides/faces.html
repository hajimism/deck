<section class="slide" data-layout="split">
  <div class="col">
    <p class="kicker">1 ／ 理論 ― 2つの顔</p>
    <h2 class="slide-title">仕事には「道具」と「玩具」、<br>2つの顔がある</h2>
    <div class="card face" data-tone="tool">
      <p class="sticker" data-tone="tool">道具としての仕事</p>
      <p><b>真剣勝負の顔。</b>誰かの役に立つ。締切を守る。品質を出す。</p>
    </div>
    <div class="card face" data-tone="toy">
      <p class="sticker" data-tone="toy" data-tilt="r">玩具としての仕事</p>
      <p><b>遊びの顔。</b>頼まれていないけど、ここを美しく作りたい。この技術を試してみたい。</p>
    </div>
  </div>
  <div class="stage matrix">
    <p class="axis axis-y">↑ 真剣さ（道具の顔）</p>
    <div class="grid4">
      <div class="cell" data-q="tl"><b>ただの苦役</b><span class="note">真剣だけど、遊びがない</span></div>
      <div class="cell" data-q="tr" data-step="faces-both"><b>力の湧く仕事</b><span class="note">真剣で、しかも遊んでいる</span></div>
      <div class="cell" data-q="bl"><b>ただこなす</b><span class="note">どちらもない</span></div>
      <div class="cell" data-q="br"><b>ただの趣味</b><span class="note">遊んでいるけど、真剣さがない</span></div>
    </div>
    <p class="axis axis-x">遊び（玩具の顔） →</p>
    <p class="sticker star" data-tone="sun" data-step="faces-both">どちらかでも、中間でもなく<br>両方が高いところ</p>
  </div>
</section>
